# bond3 の接続を確認して label を付けたワーカーごとに 1 Pod。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bond3-test
  namespace: multus-test
spec:
  selector:
    matchLabels:
      app: bond3-test
  template:
    metadata:
      labels:
        app: bond3-test
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"bond3-macvlan","interface":"net1"}]'
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        secondary-network: bond3
      containers:
        - name: tools
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep 2147483647"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
