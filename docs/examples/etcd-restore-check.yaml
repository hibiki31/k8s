apiVersion: v1
kind: Namespace
metadata:
  name: etcd-restore-check
  labels:
    app.kubernetes.io/name: etcd-restore-check
    etcd-restore-check/checkpoint: before-backup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: before-backup
  namespace: etcd-restore-check
  labels:
    app.kubernetes.io/name: etcd-restore-check
data:
  checkpoint: before-backup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: before-backup
  namespace: etcd-restore-check
  labels:
    app.kubernetes.io/name: etcd-restore-check
---
apiVersion: v1
kind: Service
metadata:
  name: before-backup
  namespace: etcd-restore-check
  labels:
    app.kubernetes.io/name: etcd-restore-check
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: etcd-restore-check
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: before-backup
  namespace: etcd-restore-check
  labels:
    app.kubernetes.io/name: etcd-restore-check
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd-restore-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd-restore-check
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
